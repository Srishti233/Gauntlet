# Example Gauntlet run config. Copy to run.yaml and edit, or pass this
# file directly: `gauntlet run --config run.example.yaml`.

seed: 1337
mutation_depth: 2
mutation_budget_per_seed: 40
i_own_this_target: false  # all targets below are localhost, so this stays false

budget:
  max_requests_per_seed: 20
  max_total_requests: 2000
  max_wall_clock_seconds: 1800

# categories: null means "run every category". Uncomment to restrict:
# categories: [instruction_override, role_jailbreak]

targets:
  - name: agent-unprotected
    type: agent
    base_url: http://localhost:8001
    timeout_seconds: 30

  - name: agent-protected
    type: agent
    base_url: http://localhost:8002
    timeout_seconds: 30

  - name: aegis
    type: aegis
    # Port 8000, confirmed by Aegis's own README ("Gateway:
    # http://localhost:8000"); an earlier version of this file guessed
    # 8080, which was wrong.
    base_url: http://localhost:8000
    api_key: aegis-eval-key
    timeout_seconds: 30

# A single "strict" mode comparison (aegis-balanced vs aegis-strict via
# two different API keys) was in an earlier version of this file, but
# that assumed Aegis switches mode per-key. Aegis's real README says
# mode is set in policy.yaml (monitor/balanced/strict), with optional
# per-key override via api_keys.policy_override -- not via separate
# hardcoded key strings. Comparing balanced vs strict for real would
# need either a second Aegis container built from a policy.yaml with
# mode: strict, or configuring policy_override for a dedicated key;
# neither was set up here (see README Limitations).
