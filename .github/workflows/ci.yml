name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check gauntlet services tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v --cov=gauntlet --cov-report=term-missing

  demo:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Bring up the full stack (including Aegis built from git)
        run: docker compose up --build -d --wait

      - name: Run the Gauntlet demo campaign
        id: demo_run
        run: |
          gauntlet demo
          python - <<'PY'
          import json
          data = json.load(open("results.json"))
          by_name = {t["target_name"]: t for t in data["target_results"]}
          unprotected = by_name.get("agent-unprotected")
          protected = by_name.get("agent-protected")
          if unprotected is None or protected is None:
              raise SystemExit("expected agent-unprotected and agent-protected in results.json")
          u_rate = unprotected["overall_harm_successes"] / max(unprotected["overall_harm_n"], 1)
          p_rate = protected["overall_harm_successes"] / max(protected["overall_harm_n"], 1)
          print(f"unprotected harm rate: {u_rate:.3f}")
          print(f"protected harm rate:   {p_rate:.3f}")
          if not (p_rate < u_rate):
              raise SystemExit("FAIL: harm rate with Aegis was not lower than without it")
          PY

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-report
          path: |
            results.json
