services:
  gullible-llm:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.gullible_llm.app:app", "--host", "0.0.0.0", "--port", "9100"]
    entrypoint: []
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-unprotected:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.agent.app:app", "--host", "0.0.0.0", "--port", "8001"]
    entrypoint: []
    environment:
      LLM_URL: "http://gullible-llm:9100/v1/chat/completions"
      LLM_KEY: ""
    ports:
      - "8001:8001"
    depends_on:
      gullible-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-protected:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.agent.app:app", "--host", "0.0.0.0", "--port", "8002"]
    entrypoint: []
    environment:
      LLM_URL: "http://aegis:8080/v1/chat/completions"
      LLM_KEY: "aegis-eval-key"
    ports:
      - "8002:8002"
    depends_on:
      aegis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aegis:
    build:
      context: ${AEGIS_REPO:-https://github.com/Srishti233/aegis.git#main}
    environment:
      UPSTREAM_URL: "http://gullible-llm:9100"
      DEFAULT_MODEL: "gullible"
      # NOTE: plain "postgresql://" makes SQLAlchemy default to the
      # psycopg2 driver, which Aegis's container image does not have
      # installed (confirmed by a real CI run: "ModuleNotFoundError:
      # No module named 'psycopg2'" at startup, inside sync
      # create_engine()). "postgresql+psycopg://" asks for psycopg
      # (v3) instead, which is what most FastAPI/SQLAlchemy stacks
      # built in the last couple of years ship by default. If Aegis's
      # image instead bundles psycopg2-binary under a different URL
      # scheme, or expects a different env var name entirely, check
      # Aegis's own README/requirements -- this one line is a guess
      # made without ever seeing that repo directly.
      DATABASE_URL: "postgresql+psycopg://aegis:aegis@postgres:5432/aegis"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      gullible-llm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
