services:
  gullible-llm:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.gullible_llm.app:app", "--host", "0.0.0.0", "--port", "9100"]
    entrypoint: []
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-unprotected:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.agent.app:app", "--host", "0.0.0.0", "--port", "8001"]
    entrypoint: []
    environment:
      LLM_URL: "http://gullible-llm:9100/v1/chat/completions"
      LLM_KEY: ""
    ports:
      - "8001:8001"
    depends_on:
      gullible-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-protected:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.agent.app:app", "--host", "0.0.0.0", "--port", "8002"]
    entrypoint: []
    environment:
      # Port 8000, not 8080 -- confirmed by Aegis's own README ("Gateway:
      # http://localhost:8000"). The key value matches EVAL_API_KEY,
      # which we set explicitly below on the aegis service itself,
      # rather than guessing at an undocumented default.
      LLM_URL: "http://aegis:8000/v1/chat/completions"
      LLM_KEY: "aegis-eval-key"
    ports:
      - "8002:8002"
    depends_on:
      aegis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    # pgvector/pgvector:pg16, NOT plain postgres:16-alpine -- confirmed
    # by Aegis's own docker-compose.yml. Aegis's semantic detector
    # needs the pgvector extension for its attack-corpus similarity
    # search; plain Postgres doesn't have it, so this image was wrong
    # before this fix (an earlier plain postgres:16-alpine would most
    # likely have let the container start, since the crash we actually
    # observed in CI was the earlier, unrelated psycopg2 driver issue,
    # but migrations or the semantic detector would very likely have
    # failed later on "extension vector does not exist" once that was
    # fixed -- this corrects it proactively rather than waiting for
    # that failure).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aegis:
    build:
      context: ${AEGIS_REPO:-https://github.com/Srishti233/aegis.git#main}
    environment:
      UPSTREAM_URL: "http://gullible-llm:9100"
      DEFAULT_MODEL: "gullible"
      # psycopg (v3), confirmed by Aegis's own requirements.txt
      # (psycopg[binary]==3.2.3) -- an earlier plain "postgresql://"
      # URL made SQLAlchemy default to psycopg2, which isn't installed,
      # and crashed the container; this was caught by a real CI run.
      DATABASE_URL: "postgresql+psycopg://aegis:aegis@postgres:5432/aegis"
      REDIS_URL: "redis://redis:6379/0"
      # Aegis's README documents these as configurable env vars but
      # does not state their literal default values, so they are set
      # explicitly here rather than guessed. agent-protected's LLM_KEY
      # above, and the aegis targets in run.example.yaml /
      # targets.example.yaml, are written to match these exact values.
      DEMO_API_KEY: "aegis-demo-key"
      EVAL_API_KEY: "aegis-eval-key"
      ADMIN_API_KEY: "aegis-admin-change-me"
    ports:
      # Port 8000, not 8080 -- confirmed by Aegis's own README
      # ("Gateway: http://localhost:8000"). An earlier version of this
      # file guessed 8080, which was wrong.
      - "8000:8000"
    depends_on:
      gullible-llm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Checked against Aegis's own docker-compose.yml: its "gateway"
      # service has NO healthcheck at all -- the author didn't
      # define one, which means there's no confirmed "this route
      # returns 200 when ready" endpoint to guess at. An earlier
      # version of this file guessed /metrics; that's plausible
      # (prometheus_client integrations are usually unauthenticated)
      # but unconfirmed, and guessing a specific HTTP path risks the
      # same failure mode as the earlier wrong /health guess: a
      # permanently-failing healthcheck that blocks agent-protected
      # (which depends on this being healthy) from ever starting, even
      # once the container itself is running fine. A plain TCP
      # connect-to-the-port check is weaker (it only proves uvicorn is
      # listening, not that the app finished startup) but can't be
      # wrong about which route exists, since it doesn't depend on one.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      # Real Aegis's own docker-compose.yml mounts these two files
      # the same way ("edit policy.yaml / rules.yaml on the host, then
      # POST /admin/policy/reload"). policy.yaml below is a verbatim
      # copy of the real file (see aegis-config/policy.yaml's own
      # header comment for why it's here and what it does and doesn't
      # prove). rules.yaml is NOT mounted, because its real content
      # was never provided to this repo's author -- if Aegis's
      # Dockerfile doesn't bake its own rules.yaml into the image
      # (unconfirmed either way), the container will fail looking for
      # /srv/rules.yaml, and the fix is to fetch the real rules.yaml
      # from the Aegis repo, add it at aegis-config/rules.yaml, and
      # uncomment the second line below.
      - ./aegis-config/policy.yaml:/srv/policy.yaml:ro
      # - ./aegis-config/rules.yaml:/srv/rules.yaml:ro
