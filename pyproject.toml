[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "Open-source red-teaming framework for LLM applications and agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Srishti" }]

dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "typer==0.12.5",
    "PyYAML==6.0.2",
    "Jinja2==3.1.4",
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools.packages.find]
include = ["gauntlet*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Lint only for real errors (undefined names, syntax-level issues).
# Style rules are deliberately excluded so they cannot fail CI.
select = ["E9", "F"]

[tool.coverage.run]
source = ["gauntlet"]
omit = ["gauntlet/cli.py"]
# No coverage gate on this slimmed-down build (cut by request, see
# README "Scope: slimmed down from the original build prompt").
