# Example standalone targets file. Referenced from run.yaml, or usable
# on its own with `gauntlet list-attacks` style commands that only need
# target metadata. All hosts here are localhost / Docker service names,
# so they pass the allowlist without --i-own-this-target.

targets:
  - name: gullible-llm-direct
    type: openai_compatible
    base_url: http://localhost:9100
    timeout_seconds: 15

  - name: agent-unprotected
    type: agent
    base_url: http://localhost:8001
    timeout_seconds: 30

  - name: agent-protected
    type: agent
    base_url: http://localhost:8002
    timeout_seconds: 30

  - name: aegis
    type: aegis
    # Port 8000, confirmed by Aegis's own README; see run.example.yaml
    # for the full note on this and on why there's only one Aegis
    # target here (no separate "strict" key -- Aegis sets mode via
    # policy.yaml, not per-key).
    base_url: http://localhost:8000
    api_key: aegis-eval-key
    timeout_seconds: 30
